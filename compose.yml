services:
  app:
    build:
      context: .
    tty: true
    volumes:
      # プロジェクトのフォルダ全体を見せる（.git も見えるようにする）
      - .:/app
    environment:
      # Windows で保存が画面に反映されないとき用（npm run dev -- --webpack と組み合わせる）
      - WATCHPACK_POLLING=true
      - PATH=/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    # Codex のサンドボックス（bwrap）を動かすため。講師の Mac 用。受講者には配らない
    security_opt:
      - seccomp:unconfined
    command: tail -f /dev/null
    ports:
      - "3070:3000"
